<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prospection Habitat</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17202a;background:#f4f6f8}
*{box-sizing:border-box}body{margin:0}.app{max-width:900px;margin:auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
h1{font-size:24px;margin:0}p{margin:3px 0;color:#64707d;font-size:13px}
button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}
.primary{background:#1769e0;color:#fff}.secondary{background:#fff;border:1px solid #d9dee5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.stat{background:#fff;border:1px solid #e1e5ea;border-radius:14px;padding:10px}.stat b{display:block;font-size:21px}.stat span{font-size:12px;color:#687481}
.map{height:430px;border-radius:18px;position:relative;overflow:hidden;border:1px solid #cfd6de;background:
linear-gradient(22deg,transparent 47%,#d8d2c8 48%,#d8d2c8 51%,transparent 52%),
linear-gradient(74deg,transparent 42%,#e1ddd5 43%,#e1ddd5 46%,transparent 47%),
linear-gradient(155deg,transparent 67%,#d3cec4 68%,#d3cec4 70%,transparent 71%),
repeating-linear-gradient(0deg,#b9c7a8 0 44px,#b2c1a0 44px 88px);
}
.map:after{content:"CARTE SATELLITE — aperçu";position:absolute;left:10px;top:10px;background:#fffdf0e8;padding:7px 10px;border-radius:9px;font-size:11px;font-weight:700}
.house{position:absolute;width:28px;height:28px;border-radius:7px;border:3px solid white;box-shadow:0 2px 8px #0005;cursor:pointer;transform:translate(-50%,-50%)}.green{background:#20a84a}.orange{background:#f39a18}.red{background:#e43b3b}.black{background:#111}
.panel{background:#fff;border:1px solid #e1e5ea;border-radius:16px;padding:14px;margin-top:12px}.panel h2{font-size:17px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#586575}
input,select,textarea{width:100%;padding:11px;border:1px solid #d6dce3;border-radius:11px;background:#fff}textarea{min-height:80px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:12px}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid #e1e5ea;border-radius:12px;padding:10px;background:#fff}.badge{padding:5px 8px;border-radius:8px;color:white;font-size:11px;font-weight:700}.item small{display:block;color:#6d7782;margin-top:3px}
.hidden{display:none}@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.map{height:360px}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>Prospection Habitat</h1><p>Suivi terrain — rénovation de l'habitat</p></div><button class="primary" id="newBtn">+ Ajouter une maison</button></header>

<section class="stats">
<div class="stat"><b id="nTotal">0</b><span>Total maisons</span></div>
<div class="stat"><b id="nGreen">0</b><span>🟢 Ventes</span></div>
<div class="stat"><b id="nOrange">0</b><span>🟠 À revoir</span></div>
<div class="stat"><b id="nRed">0</b><span>🔴 Pas intéressé</span></div>
</section>

<div class="map" id="map" aria-label="Carte de prospection"></div>
<div class="legend">
<span><i class="dot green"></i>Vente</span><span><i class="dot orange"></i>À revoir</span><span><i class="dot red"></i>Pas intéressé</span><span><i class="dot black"></i>Absent</span>
</div>

<section class="panel hidden" id="formPanel">
<h2>Fiche maison</h2>
<form id="form">
<div class="grid">
<div class="field"><label>Adresse</label><input id="address" required placeholder="12 rue des Lilas"></div>
<div class="field"><label>Statut</label><select id="status"><option value="green">🟢 Vente</option><option value="orange">🟠 À revoir</option><option value="red">🔴 Pas intéressé</option><option value="black">⚫ Absent</option></select></div>
<div class="field"><label>Nom du prospect</label><input id="name" placeholder="Nom / prénom"></div>
<div class="field"><label>Téléphone</label><input id="phone" inputmode="tel" placeholder="06…"></div>
<div class="field"><label>Travaux</label><select id="work"><option value="">—</option><option>Toiture</option><option>Façade</option><option>Isolation</option><option>VMC</option><option>Traitement du bois</option><option>Plusieurs travaux</option></select></div>
<div class="field"><label>Prochaine visite</label><input id="next" type="date"></div>
</div>
<div class="field" style="margin-top:10px"><label>Notes</label><textarea id="notes" placeholder="Informations utiles…"></textarea></div>
<div class="actions"><button class="primary" type="submit">Enregistrer</button><button class="secondary" type="button" id="cancel">Annuler</button></div>
</form>
</section>

<section class="panel">
<h2>Dernières maisons</h2><div class="list" id="list"></div>
</section>
</div>
<script>
const KEY="prospection-habitat-v1";
let data=JSON.parse(localStorage.getItem(KEY)||"[]"), editing=-1;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function statusName(s){return {green:"Vente",orange:"À revoir",red:"Pas intéressé",black:"Absent"}[s]}
function render(){
 $("nTotal").textContent=data.length;
 $("nGreen").textContent=data.filter(x=>x.status==="green").length;
 $("nOrange").textContent=data.filter(x=>x.status==="orange").length;
 $("nRed").textContent=data.filter(x=>x.status==="red").length;
 const map=$("map");map.querySelectorAll(".house").forEach(e=>e.remove());
 data.forEach((x,i)=>{const h=document.createElement("button");h.type="button";h.className="house "+x.status;h.style.left=(10+(i*19)%82)+"%";h.style.top=(20+(i*31)%65)+"%";h.title=x.address;h.setAttribute("aria-label",x.address);h.onclick=()=>edit(i);map.appendChild(h)});
 $("list").innerHTML=data.slice().reverse().slice(0,12).map((x,rev)=>{const i=data.length-1-rev;return `<div class="item"><div><b>${esc(x.address)}</b><small>${esc(x.name||"")} ${x.work?"· "+esc(x.work):""}</small></div><div><span class="badge ${x.status}" style="background:${x.status==="green"?"#20a84a":x.status==="orange"?"#f39a18":x.status==="red"?"#e43b3b":"#111"}">${statusName(x.status)}</span><button type="button" data-edit="${i}" class="secondary" style="margin-left:5px;padding:7px 9px">Modifier</button></div></div>`}).join("")||'<div style="color:#687481;font-size:13px">Aucune maison enregistrée.</div>';
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>edit(+b.dataset.edit));
}
function edit(i){
 editing=i;const x=data[i];$("formPanel").classList.remove("hidden");
 $("address").value=x.address||"";$("status").value=x.status||"green";$("name").value=x.name||"";$("phone").value=x.phone||"";$("work").value=x.work||"";$("next").value=x.next||"";$("notes").value=x.notes||"";
 window.scrollTo({top:$("formPanel").offsetTop-10,behavior:"smooth"});$("address").focus();
}
$("newBtn").onclick=()=>{editing=-1;$("form").reset();$("status").value="green";$("formPanel").classList.remove("hidden");$("address").focus()};
$("cancel").onclick=()=>{$("formPanel").classList.add("hidden")};
$("form").onsubmit=e=>{e.preventDefault();const x={address:$("address").value.trim(),status:$("status").value,name:$("name").value.trim(),phone:$("phone").value.trim(),work:$("work").value,next:$("next").value,notes:$("notes").value.trim()};if(!x.address)return;if(editing<0)data.push(x);else data[editing]=x;$("formPanel").classList.add("hidden");save()};
render();
</script>
</body>
</html>
